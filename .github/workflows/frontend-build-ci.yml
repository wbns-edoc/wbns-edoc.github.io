name: Frontend Build CI
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/staff-leave-role-visibility.test.cjs'
      - 'package.json'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/frontend-build-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm audit --audit-level=high
      - run: node tests/staff-leave-role-visibility.test.cjs
      - run: npm run build
