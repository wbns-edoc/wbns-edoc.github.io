name: Staff Leave Schema RLS CI

on:
  pull_request:
    paths:
      - 'supabase/migrations/20261021100000_staff_leave_secure_schema_draft.sql'
      - 'supabase/migrations/20261021120000_staff_leave_create_draft_rpc_draft.sql'
      - 'supabase/migrations/20261021140000_staff_leave_cancel_rpc_draft.sql'
      - 'supabase/migrations/20261021160000_staff_leave_submit_rpc_draft.sql'
      - 'supabase/migrations/20261021180000_staff_leave_decide_rpc_draft.sql'
      - 'supabase/migrations/20261022100000_staff_leave_two_stage_approval_draft.sql'
      - 'supabase/migrations/20261022210000_staff_leave_submit_two_stage_route_draft.sql'
      - 'supabase/migrations/20261023100000_staff_leave_immutable_route_snapshot_draft.sql'
      - 'supabase/migrations/20261022130000_school_responsibility_assignments_draft.sql'
      - 'supabase/migrations/20261023120000_staff_leave_responsibility_route_bridge_draft.sql'
      - 'supabase/migrations/20261023130000_staff_leave_in_app_notification_delivery_draft.sql'
      - 'tests/leave-notification-outbox.test.sql'
      - 'supabase/migrations/20261023140000_staff_leave_shared_policy_calculation_gate_draft.sql'
      - 'tests/leave-policy-calculation-gate.test.sql'
      - 'supabase/migrations/20261023150000_staff_leave_over_limit_notifications_draft.sql'
      - 'tests/leave-over-limit-notification.test.sql'
      - 'supabase/migrations/20261023160000_staff_leave_approver_dashboard_summary_draft.sql'
      - 'tests/leave-dashboard-summary.test.sql'
      - 'supabase/migrations/20261023170000_staff_leave_direct_vice_absence_evidence_draft.sql'
      - 'supabase/migrations/20261030110000_notifications_realtime_publication_draft.sql'
      - 'supabase/migrations/20261031100000_staff_leave_confirmed_rules_enforcement_draft.sql'
      - 'tests/leave-confirmed-rules-enforcement.test.sql'
      - 'tests/leave-direct-vice-absence-evidence.test.sql'
      - 'tests/leave-schema-rls.test.sql'
      - 'tests/leave-create-draft-rpc.test.sql'
      - 'tests/leave-cancel-rpc.test.sql'
      - 'tests/leave-submit-rpc.test.sql'
      - 'tests/leave-decide-rpc.test.sql'
      - 'tests/leave-responsibility-route-bridge.test.sql'
      - 'tests/leave-responsibility-submit-e2e.test.sql'
      - '.github/workflows/leave-schema-rls-ci.yml'
  push:
    branches:
      - 'feat/leave-secure-schema-draft'
    paths:
      - 'supabase/migrations/20261021100000_staff_leave_secure_schema_draft.sql'
      - 'supabase/migrations/20261021120000_staff_leave_create_draft_rpc_draft.sql'
      - 'supabase/migrations/20261021140000_staff_leave_cancel_rpc_draft.sql'
      - 'supabase/migrations/20261021160000_staff_leave_submit_rpc_draft.sql'
      - 'supabase/migrations/20261021180000_staff_leave_decide_rpc_draft.sql'
      - 'supabase/migrations/20261022100000_staff_leave_two_stage_approval_draft.sql'
      - 'supabase/migrations/20261022210000_staff_leave_submit_two_stage_route_draft.sql'
      - 'supabase/migrations/20261023130000_staff_leave_in_app_notification_delivery_draft.sql'
      - 'tests/leave-notification-outbox.test.sql'
      - 'supabase/migrations/20261023140000_staff_leave_shared_policy_calculation_gate_draft.sql'
      - 'tests/leave-policy-calculation-gate.test.sql'
      - 'supabase/migrations/20261023150000_staff_leave_over_limit_notifications_draft.sql'
      - 'tests/leave-over-limit-notification.test.sql'
      - 'supabase/migrations/20261023160000_staff_leave_approver_dashboard_summary_draft.sql'
      - 'tests/leave-dashboard-summary.test.sql'
      - 'supabase/migrations/20261023170000_staff_leave_direct_vice_absence_evidence_draft.sql'
      - 'tests/leave-direct-vice-absence-evidence.test.sql'
      - 'tests/leave-schema-rls.test.sql'
      - 'tests/leave-create-draft-rpc.test.sql'
      - 'tests/leave-cancel-rpc.test.sql'
      - 'tests/leave-submit-rpc.test.sql'
      - 'tests/leave-decide-rpc.test.sql'
      - '.github/workflows/leave-schema-rls-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  leave-schema-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leave_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d leave_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: leave_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Prepare minimal Supabase auth/profile fixtures
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create role authenticated;
          create role anon;
          create schema auth;
          grant usage on schema auth to authenticated, anon;
          create function auth.uid() returns uuid
          language sql stable
          as $$
            select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;
          create table public.profiles (id uuid primary key, full_name text not null default 'CI Fixture', is_active boolean not null default true);
          create table public.notifications (
            id uuid primary key default gen_random_uuid(),
            recipient_id uuid not null references public.profiles(id),
            document_id uuid,
            type text not null,
            title text not null,
            body text not null,
            priority text not null default 'normal' check (priority in ('normal','high','critical')),
            read_at timestamptz,
            created_at timestamptz not null default now()
          );
          create table public.roles (
            id uuid primary key,
            code text not null unique,
            name text not null
          );
          create table public.user_roles (
            user_id uuid not null references public.profiles(id),
            role_id uuid not null references public.roles(id),
            primary key(user_id, role_id)
          );
          grant select on public.profiles to authenticated;
          SQL
      - name: Apply schema draft to disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261021100000_staff_leave_secure_schema_draft.sql
      - name: Apply draft RPC migration to disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261021120000_staff_leave_create_draft_rpc_draft.sql
      - name: Run RLS isolation and direct-write regression tests
        run: psql -v ON_ERROR_STOP=1 -f tests/leave-schema-rls.test.sql
      - name: Run create-draft RPC authorization tests
        run: psql -v ON_ERROR_STOP=1 -f tests/leave-create-draft-rpc.test.sql
      - name: Apply cancellation RPC migration to disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261021140000_staff_leave_cancel_rpc_draft.sql
      - name: Run cancellation RPC authorization and cutoff tests
        run: psql -v ON_ERROR_STOP=1 -f tests/leave-cancel-rpc.test.sql
      - name: Apply submission RPC migration (fail closed until authority is verified)
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261021160000_staff_leave_submit_rpc_draft.sql
      - name: Run submission RPC authorization and idempotency tests
        run: psql -v ON_ERROR_STOP=1 -f tests/leave-submit-rpc.test.sql
      - name: Apply decision RPC migration (assigned approver only)
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261021180000_staff_leave_decide_rpc_draft.sql
      - name: Apply two-stage approval enforcement draft migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261022100000_staff_leave_two_stage_approval_draft.sql
      - name: Apply two-stage submission routing draft migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261022210000_staff_leave_submit_two_stage_route_draft.sql
      - name: Apply immutable approval route snapshot draft migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023100000_staff_leave_immutable_route_snapshot_draft.sql
      - name: Apply school responsibility settings draft migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261022130000_school_responsibility_assignments_draft.sql
      - name: Apply responsibility-to-leave route bridge draft migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023120000_staff_leave_responsibility_route_bridge_draft.sql
      - name: Apply in-app notification delivery migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023130000_staff_leave_in_app_notification_delivery_draft.sql
      - name: Apply shared policy calculation and submission gate migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023140000_staff_leave_shared_policy_calculation_gate_draft.sql
      - name: Apply over-limit marking and notification migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023150000_staff_leave_over_limit_notifications_draft.sql
      - name: Apply approver dashboard summary migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023160000_staff_leave_approver_dashboard_summary_draft.sql
      - name: Apply evidence-backed direct Vice approval migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023170000_staff_leave_direct_vice_absence_evidence_draft.sql
      - name: Apply notification realtime publication migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261030110000_notifications_realtime_publication_draft.sql
      - name: Run decision RPC authorization, idempotency, and two-stage tests
        run: psql -v ON_ERROR_STOP=1 -f tests/leave-decide-rpc.test.sql
      - name: Run responsibility-to-route bridge regression tests
        run: psql -v ON_ERROR_STOP=1 -f tests/leave-responsibility-route-bridge.test.sql
      - name: Run end-to-end responsibility-to-submission routing tests
        run: psql -v ON_ERROR_STOP=1 -f tests/leave-responsibility-submit-e2e.test.sql

      - name: Run notification privacy and idempotency tests
        run: psql -v ON_ERROR_STOP=1 -f tests/leave-notification-outbox.test.sql

      - name: Run shared policy calculation and fail-closed submission tests
        run: psql -v ON_ERROR_STOP=1 -f tests/leave-policy-calculation-gate.test.sql
      - name: Run over-limit notification fan-out tests
        run: psql -v ON_ERROR_STOP=1 -f tests/leave-over-limit-notification.test.sql
      - name: Run approver dashboard authorization and aggregate tests
        run: psql -v ON_ERROR_STOP=1 -f tests/leave-dashboard-summary.test.sql
      - name: Run Director absence evidence and direct Vice approval tests
        run: psql -v ON_ERROR_STOP=1 -f tests/leave-direct-vice-absence-evidence.test.sql
