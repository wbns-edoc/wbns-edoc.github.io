name: Commit reviewed dependency lockfile
on:
  push:
    branches:
      - safety/ci-build-config-validation
permissions:
  contents: write
concurrency:
  group: lockfile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate lockfile from package.json
        run: npm install --package-lock-only
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Add reproducible npm dependency lockfile [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
