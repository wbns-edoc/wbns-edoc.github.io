name: Staff Leave UI Build CI
on:
  pull_request:
    paths:
      - 'src/main.tsx'
      - 'src/styles.css'
      - 'package.json'
      - '.github/workflows/staff-leave-ui-ci.yml'
  push:
    branches:
      - 'feat/staff-leave-ui-draft'
    paths:
      - 'src/main.tsx'
      - 'src/styles.css'
      - 'package.json'
      - '.github/workflows/staff-leave-ui-ci.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
