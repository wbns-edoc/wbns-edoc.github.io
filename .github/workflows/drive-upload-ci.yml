name: Drive Upload CI
on:
  pull_request:
    paths:
      - "src/main.tsx"
      - "supabase/functions/drive-upload/**"
      - ".github/workflows/drive-upload-ci.yml"
      - "package.json"
  push:
    branches:
      - fix/drive-upload-metadata-atomicity-2026-10-09
    paths:
      - "src/main.tsx"
      - "supabase/functions/drive-upload/**"
      - ".github/workflows/drive-upload-ci.yml"
      - "package.json"
permissions:
  contents: read
concurrency:
  group: drive-upload-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend with isolated non-production configuration
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Drive upload Edge Function
        run: deno check supabase/functions/drive-upload/index.ts
