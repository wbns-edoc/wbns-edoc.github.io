name: Drive Upload CI
on:
  pull_request:
    paths:
      - "src/main.tsx"
      - "src/upload-error.ts"
      - "src/upload-refresh.ts"
      - "tests/upload-error_test.ts"
      - "supabase/functions/drive-upload/**"
      - "supabase/functions/permanent-delete-incoming/**"
      - "supabase/functions/user-import/**"
      - "supabase/functions/delete-document-attachment/**"
      - "supabase/functions/drive-health/**"
      - "tests/drive-health-ui-contract.test.cjs"
      - "supabase/config.toml"
      - ".github/workflows/drive-upload-ci.yml"
      - "package.json"
  push:
    branches:
      - fix/drive-upload-metadata-atomicity-2026-10-09
    paths:
      - "src/main.tsx"
      - "supabase/functions/drive-upload/**"
      - "supabase/functions/permanent-delete-incoming/**"
      - "supabase/functions/user-import/**"
      - "supabase/functions/drive-health/**"
      - "supabase/config.toml"
      - ".github/workflows/drive-upload-ci.yml"
      - "package.json"
permissions:
  contents: read
concurrency:
  group: drive-upload-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Drive health UI/Edge Function contract
        run: node tests/drive-health-ui-contract.test.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Require JWT verification for Drive upload and permanent delete
        run: |
          grep -F -A1 '[functions.drive-upload]' supabase/config.toml | grep -Fqx 'verify_jwt = true'
          grep -F -A1 '[functions.permanent-delete-incoming]' supabase/config.toml | grep -Fqx 'verify_jwt = true'
          grep -F -A1 '[functions.delete-document-attachment]' supabase/config.toml | grep -Fqx 'verify_jwt = true'
          grep -F -A1 '[functions.drive-health]' supabase/config.toml | grep -Fqx 'verify_jwt = true'
      - name: Require the school Apps Script Bridge and 20 MiB upload limit
        run: |
          grep -Fq 'GOOGLE_APPS_SCRIPT_BRIDGE_URL' supabase/functions/drive-upload/index.ts
          grep -Fq 'GOOGLE_APPS_SCRIPT_BRIDGE_SECRET' supabase/functions/drive-upload/index.ts
          grep -Fq 'GOOGLE_APPS_SCRIPT_BRIDGE_URL' supabase/functions/permanent-delete-incoming/index.ts
          grep -Fq 'GOOGLE_APPS_SCRIPT_BRIDGE_SECRET' supabase/functions/permanent-delete-incoming/index.ts
          ! grep -R -n 'GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON' supabase/functions/drive-upload supabase/functions/permanent-delete-incoming
          grep -Fq 'MAX_UPLOAD_BYTES = 20 * 1024 * 1024' supabase/functions/drive-upload/file-validation.ts
          grep -Fq 'BRIDGE_MAX_FILE_BYTES = 20 * 1024 * 1024' supabase/functions/drive-upload/index.ts
      - name: Prevent server secrets in frontend source
        run: "! grep -R -n -E 'SUPABASE_SERVICE_ROLE_KEY|GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON' src"
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend with isolated non-production configuration
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run localized upload error unit tests
        run: deno test tests/upload-error_test.ts
      - name: Run upload cleanup policy unit tests
        run: deno test supabase/functions/drive-upload/cleanup-policy_test.ts
      - name: Run upload input validation unit tests
        run: deno test supabase/functions/drive-upload/file-validation_test.ts
      - name: Type-check Drive upload Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/drive-upload/index.ts
      - name: Type-check permanent delete Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/permanent-delete-incoming/index.ts
      - name: Test user-import permission separation
        run: deno test supabase/functions/user-import/authorization_test.ts
      - name: Test user-import Auth account-state synchronization
        run: deno test supabase/functions/user-import/auth-admin-patch_test.ts
      - name: Test user-import spreadsheet status normalization
        run: deno test supabase/functions/user-import/import-row-normalization_test.ts
      - name: Type-check user-import Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/user-import/index.ts
      - name: Type-check attachment deletion Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/delete-document-attachment/index.ts
      - name: Type-check Drive health Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/drive-health/index.ts
