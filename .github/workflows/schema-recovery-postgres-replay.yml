name: Schema Recovery PostgreSQL Prerequisite Check

on:
  pull_request:
    paths:
      - "recovery/catalog/**"
      - "tests/schema-recovery-snapshot.test.cjs"
      - ".github/workflows/schema-recovery-postgres-replay.yml"
  push:
    branches:
      - "recovery/production-schema-catalog-2026-10-15"
    paths:
      - "recovery/catalog/**"
      - "tests/schema-recovery-snapshot.test.cjs"
      - ".github/workflows/schema-recovery-postgres-replay.yml"

permissions:
  contents: read

jobs:
  postgres-prerequisite-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: replay
          POSTGRES_PASSWORD: replay-only-password
          POSTGRES_DB: recovery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U replay -d recovery_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: replay
      PGPASSWORD: replay-only-password
      PGDATABASE: recovery_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Confirm isolated PostgreSQL 17 and captured trigger dependencies
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -c 'SELECT version();'
          for fn in audit_row_change default_document_department guard_document_department_change set_updated_at; do
            if ! grep -q "$fn" recovery/catalog/private-functions.sql && ! grep -q "$fn" recovery/catalog/public-functions.sql; then
              echo "Missing captured trigger function: $fn" >&2
              exit 1
            fi
          done
          node tests/schema-recovery-snapshot.test.cjs
          echo "PostgreSQL prerequisite and static snapshot checks passed."
          echo "This is not a schema replay test; snapshot application to Production remains prohibited until dependency-aware clean replay is validated."
