name: Schema Recovery PostgreSQL Prerequisite Check

on:
  pull_request:
    paths:
      - "recovery/catalog/**"
      - "tests/schema-recovery-*.test.*"
      - ".github/workflows/schema-recovery-postgres-replay.yml"
  push:
    branches:
      - "recovery/production-schema-catalog-2026-10-15"
    paths:
      - "recovery/catalog/**"
      - "tests/schema-recovery-*.test.*"
      - ".github/workflows/schema-recovery-postgres-replay.yml"

permissions:
  contents: read

jobs:
  postgres-prerequisite-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: replay
          POSTGRES_PASSWORD: replay-only-password
          POSTGRES_DB: recovery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U replay -d recovery_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: replay
      PGPASSWORD: replay-only-password
      PGDATABASE: recovery_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Confirm isolated PostgreSQL 17
        shell: bash
        run: psql -v ON_ERROR_STOP=1 -c 'SELECT version();'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned SQL parser
        run: python -m pip install --disable-pip-version-check pglast==7.10
      - name: Parse and classify recovery SQL without executing it
        run: python tests/schema-recovery-replay.test.py
      - name: Run static snapshot assertions
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate recovery evidence artifacts
        run: node tests/schema-recovery-snapshot.test.cjs
