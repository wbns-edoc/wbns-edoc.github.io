  push:
    branches:
      - "recovery/production-schema-catalog-2026-10-15"
    paths:
      - "recovery/catalog/**"
      - "tests/schema-recovery-*.test.*"
      - "tests/schema-recovery-replay-bootstrap.sql"
      - "tests/schema-recovery-rls-behavior.sql"
      - ".github/workflows/schema-recovery-postgres-replay.yml"

permissions:
  contents: read

jobs:
  disposable-postgres-replay:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: replay
          POSTGRES_PASSWORD: replay-only-password
          POSTGRES_DB: recovery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U replay -d recovery_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: replay
      PGPASSWORD: replay-only-password
      PGDATABASE: recovery_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Confirm isolated PostgreSQL 17
        run: psql -v ON_ERROR_STOP=1 -c 'SELECT version();'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned SQL parser
        run: python -m pip install --disable-pip-version-check pglast==7.21
      - name: Parse and generate dependency-ordered SQL phases
        run: python tests/schema-recovery-replay.test.py --out-dir "$RUNNER_TEMP/wbns-replay"
      - name: Bootstrap disposable compatibility objects
        run: psql -v ON_ERROR_STOP=1 -f tests/schema-recovery-replay-bootstrap.sql
      - name: Replay phases on disposable PostgreSQL only
        shell: bash
        run: |
          set -euo pipefail
          for phase in "$RUNNER_TEMP"/wbns-replay/*.sql; do
            echo "::group::Applying $(basename "$phase") to disposable database"
            psql -v ON_ERROR_STOP=1 -f "$phase"
            echo "::endgroup::"
          done
      - name: Apply active-department permission guard (disposable DB only)
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261030150000_require_active_department_for_scoped_permissions.sql
      - name: Verify reconstructed object inventory
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            table_count integer;
            type_count integer;
            policy_count integer;
            trigger_count integer;
            function_count integer;
            view_count integer;
            tables_without_rls integer;
            views_without_invoker integer;
            broad_policies integer;
          BEGIN
            SELECT count(*) INTO table_count FROM pg_tables WHERE schemaname = 'public';
            SELECT count(*) INTO type_count FROM pg_type t JOIN pg_namespace n ON n.oid=t.typnamespace WHERE n.nspname='public' AND t.typtype='e';
            SELECT count(*) INTO policy_count FROM pg_policies WHERE schemaname='public';
            SELECT count(*) INTO trigger_count FROM pg_trigger tr JOIN pg_class c ON c.oid=tr.tgrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND NOT tr.tgisinternal;
            SELECT count(*) INTO function_count FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname IN ('public','private') AND NOT EXISTS (SELECT 1 FROM pg_depend d WHERE d.classid = 'pg_proc'::regclass AND d.objid = p.oid AND d.deptype = 'e');
            SELECT count(*) INTO view_count FROM pg_views WHERE schemaname='public';
            SELECT count(*) INTO tables_without_rls FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind IN ('r','p') AND NOT c.relrowsecurity;
            SELECT count(*) INTO views_without_invoker FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind='v' AND (c.reloptions IS NULL OR NOT ('security_invoker=true' = ANY(c.reloptions)));
            SELECT count(*) INTO broad_policies FROM pg_policies WHERE schemaname='public' AND ('anon' = ANY(roles) OR 'public' = ANY(roles));
            IF table_count <> 25 THEN RAISE EXCEPTION 'expected 25 public tables, got %', table_count; END IF;
            IF type_count <> 5 THEN RAISE EXCEPTION 'expected 5 public enums, got %', type_count; END IF;
            IF policy_count <> 45 THEN RAISE EXCEPTION 'expected 45 public policies, got %', policy_count; END IF;
            IF trigger_count <> 12 THEN RAISE EXCEPTION 'expected 12 public triggers, got %', trigger_count; END IF;
            IF function_count <> 54 THEN RAISE EXCEPTION 'expected 54 public/private functions, got %', function_count; END IF;
            IF view_count <> 2 THEN RAISE EXCEPTION 'expected 2 public views, got %', view_count; END IF;
            IF tables_without_rls <> 0 THEN RAISE EXCEPTION 'expected all public tables to enable RLS, found % without RLS', tables_without_rls; END IF;
            IF views_without_invoker <> 0 THEN RAISE EXCEPTION 'expected all public views to use security_invoker=true, found % without it', views_without_invoker; END IF;
            IF broad_policies <> 0 THEN RAISE EXCEPTION 'expected no public policies targeting anon/PUBLIC, found %', broad_policies; END IF;
          END $$;
          SQL
      - name: Test admin and department document RLS behavior
        run: psql -v ON_ERROR_STOP=1 -f tests/schema-recovery-rls-behavior.sql
      - name: Apply staff leave draft to recovered October 15 catalog (disposable PostgreSQL only)
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/leave-auth-users-fixture.sql
          # The recovered schema artifact captures RLS policies but not Supabase API-role ACLs.
          # Mirror the required API-role schema/function/profile grants in this disposable database only.
          psql -v ON_ERROR_STOP=1 <<'SQL'
          GRANT USAGE ON SCHEMA public, private, auth TO authenticated;
          GRANT EXECUTE ON FUNCTION auth.uid() TO authenticated;
          GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA private TO authenticated;
          GRANT SELECT ON public.profiles TO authenticated;
          SQL
          for migration in \
            20261020230000_staff_leave_workflow_foundation_draft.sql \
            20261021100000_staff_leave_secure_schema_draft.sql \
            20261021120000_staff_leave_create_draft_rpc_draft.sql \
            20261021140000_staff_leave_cancel_rpc_draft.sql \
            20261021160000_staff_leave_submit_rpc_draft.sql \
            20261021180000_staff_leave_decide_rpc_draft.sql \
            20261022100000_staff_leave_two_stage_approval_draft.sql \
            20261022130000_school_responsibility_assignments_draft.sql \
            20261022210000_staff_leave_submit_two_stage_route_draft.sql \
            20261023100000_staff_leave_immutable_route_snapshot_draft.sql \
            20261023120000_staff_leave_responsibility_route_bridge_draft.sql \
            20261023130000_staff_leave_in_app_notification_delivery_draft.sql \
            20261023140000_staff_leave_shared_policy_calculation_gate_draft.sql \
            20261023150000_staff_leave_over_limit_notifications_draft.sql \
            20261023160000_staff_leave_approver_dashboard_summary_draft.sql \
            20261023170000_staff_leave_direct_vice_absence_evidence_draft.sql \
            20261030110000_notifications_realtime_publication_draft.sql; do
            echo "::group::Applying $migration to disposable PostgreSQL catalog"
            psql -v ON_ERROR_STOP=1 -f "supabase/migrations/$migration"
            echo "::endgroup::"
          done
          for test_file in \
            leave-schema-rls.test.sql \
            leave-create-draft-rpc.test.sql \
            leave-submit-rpc.test.sql \
            leave-cancel-rpc.test.sql \
            leave-decide-rpc.test.sql \
            leave-notification-outbox.test.sql \
            leave-responsibility-route-bridge.test.sql \
            leave-responsibility-submit-e2e.test.sql \
            leave-policy-calculation-gate.test.sql \
            leave-over-limit-notification.test.sql \
            leave-dashboard-summary.test.sql \
            leave-direct-vice-absence-evidence.test.sql; do
            echo "::group::Running $test_file on disposable PostgreSQL catalog"
            psql -v ON_ERROR_STOP=1 -f "tests/$test_file"
            echo "::endgroup::"
          done

      - name: Run static snapshot assertions
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate recovery evidence artifacts
        run: node tests/schema-recovery-snapshot.test.cjs
