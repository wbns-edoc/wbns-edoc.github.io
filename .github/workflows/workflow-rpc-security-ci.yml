name: Workflow RPC Security CI

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/database/**"
      - "supabase/config.toml"
      - ".github/workflows/workflow-rpc-security-ci.yml"
      - "scripts/check-workflow-rpc-migration-order.mjs"
  push:
    branches:
      - fix/drive-upload-metadata-atomicity-2026-10-09
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/database/**"
      - "supabase/config.toml"
      - ".github/workflows/workflow-rpc-security-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-rpc-security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Check workflow RPC migration-order regression
        run: node scripts/check-workflow-rpc-migration-order.mjs

      - name: Reject incomplete migration source before starting containers
        shell: bash
        run: |
          if grep -q "Full SQL is maintained in the migration applied to the WBNS Supabase project" supabase/migrations/20261007200000_foundation_schema_rbac_rls.sql; then
            echo "::error::The foundation migration in the repository is a placeholder, not a reproducible schema migration. Recover and review the actual migration SQL from an authoritative backup/source before running local database tests."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: 2.81.3

      - name: Start isolated local Supabase services
        id: start_local
        run: supabase start

      - name: Apply repository migrations to the disposable local database
        run: supabase db reset

      - name: Run workflow RPC security catalog tests
        run: supabase test db

      - name: Stop local Supabase services
        if: always() && steps.start_local.outcome != 'skipped'
        run: supabase stop --no-backup
