name: Workflow RPC Security CI

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/database/**"
      - "supabase/tests/fixtures/recovered-production-catalog.sql"
      - "supabase/config.toml"
      - ".github/workflows/workflow-rpc-security-ci.yml"
      - ".github/workflows/recovered-catalog-fixture-ci.yml"
      - "scripts/check-workflow-rpc-migration-order.mjs"
  push:
    branches:
      - fix/drive-upload-metadata-atomicity-2026-10-09
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/database/**"
      - "supabase/tests/fixtures/recovered-production-catalog.sql"
      - "supabase/config.toml"
      - ".github/workflows/workflow-rpc-security-ci.yml"
      - ".github/workflows/recovered-catalog-fixture-ci.yml"
      - "scripts/check-workflow-rpc-migration-order.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-rpc-security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Check workflow RPC migration-order regression
        run: node scripts/check-workflow-rpc-migration-order.mjs

      - uses: supabase/setup-cli@v1
        with:
          version: 2.81.3

      - name: Prepare isolated catalog fixture and all authorization migrations
        shell: bash
        run: |
          set -euo pipefail
          test_dir="$RUNNER_TEMP/wbns-rpc-security"
          mkdir -p "$test_dir/supabase/migrations" "$test_dir/supabase/tests"
          cp supabase/config.toml "$test_dir/supabase/config.toml"
          sed -i 's/^project_id = .*/project_id = "wbns-edoc-rpc-security-ci"/' "$test_dir/supabase/config.toml"
          cp supabase/tests/fixtures/recovered-production-catalog.sql "$test_dir/supabase/migrations/20261010120000_recovered_production_catalog.sql"
          for migration in \
            20261010130000_secure_public_workflow_rpc_wrappers_v1.sql \
            20261010150000_grant_director_document_update.sql \
            20261010160000_multi_department_membership_v1.sql \
            20261010170000_department_scoped_document_access_v1.sql \
            20261010180000_scope_workflow_assignment_and_status.sql \
            20261010190000_department_aware_document_registration_v1.sql \
            20261011100000_department_scoped_roles_permissions_v1.sql \
            20261011120000_department_role_matrix_seed_fix.sql \
            20261011121000_department_scoped_read_rpc_fix.sql \
            20261011140000_department_scoped_write_rpc_guards.sql \
            20261011150000_department_scoped_access_final_correction.sql \
            20261011160000_department_scoped_approval_guards.sql \
            20261011170000_department_scoped_rls_and_file_guards.sql \
            20261011180000_close_remaining_department_rls_bypasses.sql \
            20261011190000_separate_document_edit_from_approve_assign.sql \
            20261011200000_guard_document_file_attachment.sql \
            20261011210000_require_department_membership_for_scoped_permissions.sql
          do
            cp "supabase/migrations/$migration" "$test_dir/supabase/migrations/"
          done
          for test_file in \
            workflow_rpc_security.test.sql \
            workflow_rpc_wrappers.sql \
            automatic_admin_document_permissions.sql \
            department_scoped_document_access.sql \
            department_scope_behavior.sql \
            recovered_catalog_fixture_smoke.sql \
            department_scoped_access_final_correction.sql \
            department_scoped_rls_file_guards.test.sql
          do
            cp "supabase/tests/database/$test_file" "$test_dir/supabase/tests/"
          done
          echo "TEST_DIR=$test_dir" >> "$GITHUB_ENV"

      - name: Start isolated local Supabase services
        working-directory: ${{ env.TEST_DIR }}
        run: supabase start -x gotrue,realtime,storage-api,imgproxy,kong,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Lint isolated catalog and forward migrations
        id: lint
        continue-on-error: true
        working-directory: ${{ env.TEST_DIR }}
        run: supabase db lint --local --schema public,private --fail-on error

      - name: Run workflow RPC and department-scope regression tests
        working-directory: ${{ env.TEST_DIR }}
        run: supabase test db --local

      - name: Fail job if schema lint reported errors
        if: steps.lint.outcome == 'failure'
        run: |
          echo "Schema lint reported errors; tests ran for diagnostics, but CI must remain failed."
          exit 1

      - name: Stop isolated local Supabase services
        if: always()
        working-directory: ${{ env.TEST_DIR }}
        run: supabase stop --no-backup
