name: Leave Domain Guards CI

on:
  pull_request:
    paths:
      - "src/leave-domain.ts"
      - "tests/leave-domain.test.ts"
      - ".github/workflows/leave-domain-guards-ci.yml"

permissions:
  contents: read

concurrency:
  group: leave-domain-guards-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  leave-domain-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run leave routing and cutoff unit tests
        run: deno test tests/leave-domain.test.ts
